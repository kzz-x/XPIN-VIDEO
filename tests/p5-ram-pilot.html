<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><title>XPIN-VIDEO P5 | RAM Desktop Pilot</title><meta name="viewport" content="width=device-width,initial-scale=1"/><style>
*{box-sizing:border-box}body{margin:0;background:#080b0f;color:#e7edf4;font:13px system-ui,'Microsoft YaHei',sans-serif}.shell{display:flex;min-height:100vh;gap:0}.stage{flex:1;min-width:0;display:grid;place-content:center;padding:24px;background:radial-gradient(circle at 48% 45%,#1a2028 0,#080b0f 60%)}canvas{width:min(100%,960px);height:auto;box-shadow:0 15px 50px #0008;border:1px solid #39424c;max-height:80vh;aspect-ratio:16/9}.side{width:270px;flex-shrink:0;padding:19px;background:#11151b;border-left:1px solid #353b43}.eyebrow{font-size:10px;letter-spacing:3px;color:#92ee62}h2{font-size:21px;margin:9px 0 5px}.hint{font-size:11px;line-height:1.6;color:#93a0ac;margin-bottom:24px}.control{margin:21px 0}.control label{display:flex;justify-content:space-between;margin-bottom:9px;color:#ccd6e0}.control output{font-family:monospace;color:#9cf078}input[type=range]{width:100%;accent-color:#a0ec65}button{border:1px solid #55636e;border-radius:7px;background:#202932;color:#dfe9ef;padding:9px 12px;cursor:pointer;margin:3px 2px}button:hover{background:#303c49}.timeline{margin-top:26px}.marks{display:flex;justify-content:space-between;font-size:10px;color:#7e8a98}.status{font:11px/1.5 monospace;color:#8c98a2;margin-top:20px}.tiny{color:#798795;font-size:11px}.buttons{margin-top:12px}.mobile{display:none}@media(max-width:900px){.shell{display:block}.side{width:100%;border-left:none;border-top:1px solid #363d48}.stage{padding:12px}}
</style></head><body><div class="shell"><main class="stage"><canvas id="screen" width="960" height="540" aria-label="RAM 动效预览"></canvas></main><aside class="side"><div class="eyebrow">差点控件 / XPIN</div><h2>RAM 工作台</h2><div class="hint">P5 单镜功能试运行 · 本例为抽象二维示意，不代表真实芯片布局或最终商业质量。</div><div class="control"><label for="taskCount">任务卡数量<output id="taskCountOut">6</output></label><input id="taskCount" type="range" min="1" max="8" value="6" step="1"></div><div class="control"><label for="speed">动画速度<output id="speedOut">1.00</output></label><input id="speed" type="range" min="0.5" max="2" value="1" step="0.05"></div><div class="control"><label for="brightness">发光强度<output id="brightnessOut">1.00</output></label><input id="brightness" type="range" min="0.2" max="1.8" value="1" step="0.1"></div><div class="control"><label for="zoom">画面缩放<output id="zoomOut">1.00</output></label><input id="zoom" type="range" min="0.8" max="1.2" value="1" step="0.01"></div><div class="timeline"><label for="timeline">时间线 · 关键事件 Marker</label><input id="timeline" type="range" min="0" max="5" value="0" step="0.001"><div class="marks"><span>00 起始</span><span>01 放入</span><span>02 展开</span><span>03 停留</span></div><div class="buttons"><button id="play">播放 / 暂停</button><button id="restart">回到开头</button></div></div><div class="status" id="status"></div><div class="tiny">当前预览 960×540 · 5.000 s · 可确定性 Seek</div></aside></div>
<script>
(() => { 'use strict';
const canvas=document.querySelector('#screen'),ctx=canvas.getContext('2d',{alpha:false});
const S={time:0,taskCount:6,speed:1,brightness:1,zoom:1,playing:false,last:null};
const markers=[{t:0,label:'0 起始'},{t:1.15,label:'1 放入'},{t:2.55,label:'2 展开'},{t:4.00,label:'3 停留'}];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x)},lerp=(a,b,x)=>a+(b-a)*x;
function round(x,y,w,h,r=12){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function text(str,x,y,size,color='#fff',weight=600,align='left'){ctx.fillStyle=color;ctx.textAlign=align;ctx.font=weight+' '+size+'px system-ui, Microsoft YaHei, sans-serif';ctx.fillText(str,x,y)}
function draw(t){
ctx.save();ctx.fillStyle='#090e15';ctx.fillRect(0,0,960,540);
const bg=ctx.createRadialGradient(470,268,30,470,268,590);bg.addColorStop(0,'#152330');bg.addColorStop(0.48,'#111821');bg.addColorStop(1,'#090e15');ctx.fillStyle=bg;ctx.fillRect(0,0,960,540);
ctx.globalAlpha=.2;ctx.strokeStyle='#35515d';ctx.lineWidth=1;for(let x=0;x<960;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,540);ctx.stroke()}for(let y=0;y<540;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(960,y);ctx.stroke()}ctx.globalAlpha=1;
ctx.translate(480,280);ctx.scale(S.zoom,S.zoom);ctx.translate(-480,-280);
text('MEMORY / 01',62,62,12,'#9af27a',800);text('RAM',60,137,64,'#e9f1f7',800);text('设备正在处理的数据，会暂存在这里。',62,172,17,'#aebbc4',400);
text('ACTIVE TASKS',64,235,11,'#9eacb8',700);text(String(Math.min(S.taskCount,Math.floor(8*smooth((t+.30)/3.6)))).padStart(2,'0')+' / 08',65,270,29,'#9feb76',700);
text('临时工作台',64,415,17,'#e6ecef',600);text('容量越大，可以同时摊开的任务越多',64,443,12,'#8e9aa5',400);
const bx=375,by=96,bw=518,bh=370;
ctx.shadowColor='rgba(138,230,105,'+(0.12*S.brightness)+')';ctx.shadowBlur=32*S.brightness;round(bx,by,bw,bh,20);ctx.fillStyle='#18252a';ctx.fill();ctx.shadowBlur=0;ctx.lineWidth=2;ctx.strokeStyle='#53746b';ctx.stroke();
ctx.save();round(bx+10,by+10,bw-20,bh-20,14);ctx.clip();
for(let i=0;i<5;i++)for(let j=0;j<4;j++){const cx=bx+25+i*99,cy=by+30+j*90;ctx.strokeStyle='rgba(134,196,172,.17)';ctx.lineWidth=1;round(cx,cy,84,76,8);ctx.stroke()}
const labels=['浏览器','视频','地图','音乐','聊天','照片','文档','游戏'];
for(let i=0;i<S.taskCount;i++){
const x=bx+25+(i%5)*99,y=by+30+Math.floor(i/5)*90;
let p=smooth((t-(0.75+i*.26))/.72);if(p<=0)continue;
ctx.save();ctx.translate(x+42,y+38);ctx.scale(lerp(.58,1,p),lerp(.58,1,p));ctx.translate(-42,-38);ctx.globalAlpha=p;
ctx.fillStyle='#263c3a';round(0,0,84,76,8);ctx.fill();ctx.strokeStyle='rgba(164,243,114,'+(0.9*S.brightness)+')';ctx.lineWidth=1.3;ctx.stroke();
const c=i%3===0?'#a9f477':i%3===1?'#78e3de':'#fbcd7d';ctx.fillStyle=c;round(13,14,25,24,6);ctx.fill();text(String(i+1).padStart(2,'0'),25,31,11,'#163027',800,'center');
text(labels[i],12,60,13,'#d7e9dc',650);ctx.restore();
}
ctx.restore();
text('RAM / WORKSPACE',bx+21,by+bh+22,10,'#a7d1bd',500);text('DATA / ACTIVE',bx+bw-22,by+bh+22,10,'#a7d1bd',500,'right');
const u=smooth(t/4);ctx.strokeStyle='rgba(162,241,120,'+(.3+.5*u)*S.brightness+')';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(302,270);ctx.lineTo(bx-16,270);ctx.stroke();ctx.fillStyle='#a4ef7c';ctx.beginPath();ctx.arc(lerp(302,bx-16,smooth((t-.55)/1)),270,5,0,Math.PI*2);ctx.fill();
text('EXPLAINER / 2026',60,502,11,'#647987',500);text('TECHNICAL MOTION DESIGN — PREVIEW',899,502,10,'#647987',500,'right');
ctx.restore();return canvas.toDataURL('image/png');
}
function sync(){for(const id of ['taskCount','speed','brightness','zoom']){const v=S[id];document.getElementById(id).value=v;document.getElementById(id+'Out').textContent=id==='taskCount'?v:Number(v).toFixed(2)}document.getElementById('timeline').value=S.time;document.getElementById('status').textContent='时间 '+S.time.toFixed(3)+' s · '+(S.playing?'播放中':'暂停')+' · Marker '+markers.filter(m=>m.t<=S.time).at(-1).label;draw(S.time)}
function seek(t){S.time=clamp(Number(t),0,5);sync()};function tick(now){if(S.playing){if(S.last!==null)S.time=clamp(S.time+(now-S.last)/1000*S.speed,0,5);S.last=now;if(S.time>=5){S.playing=false;S.last=null}sync();if(S.playing)requestAnimationFrame(tick)}}
for(const id of ['taskCount','speed','brightness','zoom'])document.getElementById(id).addEventListener('input',e=>{S[id]=Number(e.target.value);sync()});
document.getElementById('timeline').addEventListener('input',e=>{S.playing=false;S.last=null;seek(e.target.value)});
document.getElementById('play').addEventListener('click',()=>{S.playing=!S.playing;if(S.playing){if(S.time>=5)S.time=0;S.last=null;requestAnimationFrame(tick)}else S.last=null;sync()});document.getElementById('restart').addEventListener('click',()=>{S.playing=false;S.last=null;seek(0)});
window.XPIN={seek,set:(key,value)=>{if(!(key in S))throw Error('unknown control');S[key]=Number(value);sync()},snapshot:()=>canvas.toDataURL('image/png'),getState:()=>({...S}),markers,renderAt:seek};sync();
})();
</script></body></html>
